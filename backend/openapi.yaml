openapi: 3.0.3
info:
  title: Projeto 3 - API de panorâmicas 360°
  version: 0.1.0
  description: Backend autenticado para geração de imagens panorâmicas 360° por stitching.
tags:
  - name: Sistema
  - name: Autenticação
  - name: Panorâmicas
paths:
  /api/health:
    get:
      tags: [Sistema]
      summary: Verifica se o servidor está no ar
      responses:
        "200":
          description: Servidor no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/register:
    post:
      tags: [Autenticação]
      summary: Cadastra um usuário
      description: A senha precisa ter pelo menos 8 caracteres.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    example: teste@teste.com
        "400":
          description: Email inválido ou senha curta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email já cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/login:
    post:
      tags: [Autenticação]
      summary: Faz login e devolve o token
      description: Copie o valor de `token` da resposta e cole no botão Authorize para usar as rotas protegidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Login aceito
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "401":
          description: Email ou senha incorretos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/google:
    post:
      tags: [Autenticação]
      summary: Faz login com Google e devolve o token
      description: Recebe o ID token que o botão do Google entrega ao front (`credential`). Na primeira vez cria o usuário, nas próximas entra na mesma conta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
      responses:
        "200":
          description: Login aceito
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "400":
          description: Faltou o credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: ID token inválido, vencido, de outro app ou com email não verificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: O email já tem conta com senha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: O backend não conseguiu falar com o Google
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/me:
    get:
      tags: [Autenticação]
      summary: Devolve o usuário logado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuário dono do token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Token ausente, inválido ou vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/panoramas:
    get:
      tags: [Panorâmicas]
      summary: Lista as panorâmicas do usuário logado
      description: Devolve só as panorâmicas de quem é dono do token, da mais recente para a mais antiga.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de panorâmicas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Panorama"
        "401":
          description: Token ausente, inválido ou vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Panorâmicas]
      summary: Envia o ZIP de uma captura
      description: Recebe o `360_photos.zip` exportado pelo app de captura e registra a panorâmica como pendente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: ZIP recebido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panorama"
        "400":
          description: Arquivo ausente ou que não é um ZIP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente, inválido ou vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Arquivo maior que 300 MB
  /api/uploads/{upload_id}/parts/{index}:
    put:
      tags: [Panorâmicas]
      summary: Envia uma parte do ZIP
      description: O app divide o ZIP em partes de até 20 MB, porque a Cloudflare recusa requisições acima de 100 MB. O `upload_id` é um UUID gerado pelo app e `index` começa em 0.
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: index
          in: path
          required: true
          schema:
            type: integer
            example: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Parte recebida
        "400":
          description: upload_id ou index inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente, inválido ou vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Parte maior que 20 MB ou soma das partes maior que 300 MB
  /api/uploads/{upload_id}/finish:
    post:
      tags: [Panorâmicas]
      summary: Junta as partes e registra a panorâmica
      description: Junta as partes na ordem, confere se o resultado é um ZIP e registra a panorâmica como pendente.
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: integer
                  example: 14
      responses:
        "201":
          description: ZIP recebido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panorama"
        "400":
          description: Envio inválido ou arquivo que não é um ZIP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token ausente, inválido ou vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Faltam partes do arquivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/panoramas/{id}/image:
    get:
      tags: [Panorâmicas]
      summary: Devolve a imagem de uma panorâmica pronta
      description: JPEG equiretangular de 8192×4096. Só o dono da panorâmica consegue baixar.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Imagem da panorâmica
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          description: Token ausente, inválido ou vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Panorâmica não existe, é de outro usuário ou o arquivo sumiu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Panorâmica ainda não está pronta (pendente, processando ou falhou)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: teste@teste.com
        password:
          type: string
          example: "12345678"
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: teste@teste.com
        created_at:
          type: string
          example: "2026-10-09 21:36:26"
    Panorama:
      type: object
      properties:
        id:
          type: integer
          example: 1
        status:
          type: string
          example: pending
        created_at:
          type: string
          example: "2026-10-09 21:36:26"
    Error:
      type: object
      properties:
        error:
          type: string
